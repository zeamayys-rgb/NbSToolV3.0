<!-- Shared data the documentation reads its live parameters from.
     Order matters: these must be defined before technical-docs.js runs. -->
<script src="js/analysis-shared.js"></script>
<script src="js/f05-shared.js"></script>
<script src="js/people-context.js"></script>
<script src="js/nav-mobile.js"></script>
<script src="js/technical-docs.js"></script>
<script>
  /* f05-shared.js and people-context.js declare their catalogues with top-level
     `const`, which is script-scoped rather than a window property. Bridge them
     so readLiveParameters() can find them the same way it finds NBS_DATA. */
  if (typeof ecosystems !== 'undefined' && !window.ecosystems) window.ecosystems = ecosystems;
  if (typeof indicatorMeta !== 'undefined' && !window.indicatorMeta) window.indicatorMeta = indicatorMeta;
  if (typeof NBS_PEOPLE !== 'undefined' && !window.NBS_PEOPLE) window.NBS_PEOPLE = NBS_PEOPLE;
  if (typeof NBS_ANALYSIS !== 'undefined' && !window.NBS_ANALYSIS) window.NBS_ANALYSIS = NBS_ANALYSIS;
  loadTechnicalDocs();
  window.addEventListener('hashchange', function () {
    var m = location.hash.match(/^#docs\/([a-z0-9-]+)$/);
    if (m) openTechnicalDoc(m[1], false);
  });
</script>
